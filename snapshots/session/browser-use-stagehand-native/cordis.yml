- id: agent-default-model
  name: '@cortex-ai/cortex-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash-vision-exp

- id: session-persistence-jsonl
  name: '@cortex-ai/cortex-session-persistence-jsonl'
  config:
    root: !!js cortexHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@cortex-ai/cortex-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@cortex-ai/cortex-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- id: attachment-local
  name: '@cortex-ai/cortex-attachment-local'

- insert:
    - id: browser-use
      name: '@cortex-ai/cortex-browser-use'
    - id: native-browser-use-fixture
      name: './native-fixture.mjs'
