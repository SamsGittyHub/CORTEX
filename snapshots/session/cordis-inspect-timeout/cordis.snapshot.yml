- id: llm-deepseek
  name: '@cortex-ai/cortex-llm-deepseek-api-key'
  disabled: true

- id: agent-default-model
  name: '@cortex-ai/cortex-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@cortex-ai/cortex-session-persistence-jsonl'
  config:
    root: !!js cortexHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@cortex-ai/cortex-agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@cortex-ai/cortex-tools'
  config:
    mode: both

- id: system-prompt
  name: '@cortex-ai/cortex-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: cordis-host-runner
      name: '@cortex-ai/cortex-cordis-host-runner'
      config:
        clientInspectTimeoutMs: 100
    - id: cordis-inspect-providers
      name: '@cortex-ai/cortex-tool-cordis/host'
    - id: tool-cordis
      name: '@cortex-ai/cortex-tool-cordis'
    - id: llm-replay
      name: '@cortex-ai/cortex-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
    - id: client-inspect-timeout-fixture
      name: ./client-fixture.mjs
