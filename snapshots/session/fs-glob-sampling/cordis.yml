# Minimal live counterpart for the glob-sampling snapshot composition.
- id: llm-deepseek
  name: '@cortex-ai/cortex-llm-deepseek-api-key'
  config:
    models:
      - id: deepseek-v4-pro

- id: subprocess
  name: '@cortex-ai/cortex-subprocess-local'

- id: agent-default-model
  name: '@cortex-ai/cortex-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@cortex-ai/cortex-session-persistence-jsonl'
  config:
    root: !!js cortexHomePath('sessions')
    compression: !!js 'process.env.CORTEX_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@cortex-ai/cortex-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@cortex-ai/cortex-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent working in {{cwd}}.

- id: tool-jobs
  name: '@cortex-ai/cortex-tool-jobs'
  disabled: true

- id: goal
  name: '@cortex-ai/cortex-goal'
  disabled: true

- id: goal-round-driver
  name: '@cortex-ai/cortex-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@cortex-ai/cortex-command-goal'
  disabled: true

- id: tool-goal
  name: '@cortex-ai/cortex-tool-goal'
  disabled: true

- id: skill
  name: '@cortex-ai/cortex-skill'
  disabled: true

- id: skill-filesystem
  name: '@cortex-ai/cortex-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@cortex-ai/cortex-tool-skill'
  disabled: true

- id: tool-fs-search
  name: '@cortex-ai/cortex-tool-fs-search'
  config:
    sampleOverCapGlobResults: true
    globMaxResults: 4

- id: spill-local
  name: '@cortex-ai/cortex-spill-local'
  config:
    root: !!js process.env.CORTEX_SNAPSHOT_SPILL_ROOT ?? './.spill'

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.CORTEX_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.CORTEX_SNAPSHOT_SPILL_LOCATOR_ROOT
