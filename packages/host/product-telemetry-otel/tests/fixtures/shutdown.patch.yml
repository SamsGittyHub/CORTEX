- id: session-telemetry-otel
  disabled: true
- id: headless-startup
  disabled: true
- id: headless-runner
  disabled: true
- insert:
    - id: product-telemetry-otel
      name: '@cortex-ai/cortex-host-product-telemetry-otel'
      config:
        endpoint: !!js process.env.CORTEX_PRODUCT_TELEMETRY_TEST_ENDPOINT
        serviceName: cortex-telemetry-test
        serviceVersion: !!js process.env.CORTEX_APP_VERSION
        compression: gzip
        scheduledDelayMillis: 30000
        timeoutMillis: 15000
        exportTimeoutMillis: 20000
        shutdownTimeoutMillis: 2000
