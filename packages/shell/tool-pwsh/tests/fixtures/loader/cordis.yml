# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@cortex-ai/cortex-system-prompt'

- id: tools
  name: '@cortex-ai/cortex-tools'

- id: subprocess
  name: '@cortex-ai/cortex-subprocess-local'

- id: bash
  name: '@cortex-ai/cortex-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@cortex-ai/cortex-shell-env'

- id: tasks
  name: '@cortex-ai/cortex-jobs-local'

- id: tool-jobs
  name: '@cortex-ai/cortex-tool-jobs'

- id: tool-pwsh
  name: '@cortex-ai/cortex-tool-pwsh'
